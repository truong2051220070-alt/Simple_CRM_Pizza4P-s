name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests & Lint
  backend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
      
      - name: Lint Backend (ESLint)
        run: |
          cd backend
          npm run lint || echo "No lint script"
      
      - name: Backend Tests
        run: |
          cd backend
          npm test || echo "No tests configured"
      
      - name: Build Backend
        run: |
          cd backend
          npm run build || echo "No build script"

  # Frontend Tests & Build
  frontend-ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint || echo "No lint script"
      
      - name: Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests || echo "No tests configured"
      
      - name: Build Frontend
        run: |
          cd frontend
          REACT_APP_API_URL=http://localhost:5000 npm run build

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: simple-crm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: simple-crm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Checks
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for Secrets
        run: |
          if grep -r "mongodb://.*:.*@" . --include="*.js" --include="*.json" --exclude-dir=node_modules; then
            echo "ERROR: Credentials found in source code!"
            exit 1
          fi
          echo "✓ No hardcoded secrets found"
      
      - name: Check Environment Variables
        run: |
          echo "✓ Checking environment configuration..."
          test -f backend/.env.example || echo "WARNING: backend/.env.example missing"
          test -f frontend/.env.example || echo "WARNING: frontend/.env.example missing"
